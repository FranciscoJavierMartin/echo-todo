# docker compose up --build  →  API on http://localhost:8080
name: echo-todo

x-db-url: &db-url "postgres://todo:todo@postgres:5432/todo?sslmode=disable"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations, then exits. The API waits for it to succeed.
  migrate:
    build: .
    image: echo-todo:local
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    image: echo-todo:local
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["8080:8080"]
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  pgdata:
  uploads:
